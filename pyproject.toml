[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itrs-to-osm"
version = "0.2.0.dev0"
description = "Copy ITRS mountain bike trail ratings from a rater's GeoJSON export onto OpenStreetMap ways, for review in JOSM"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steve Vigneau" }]
keywords = ["openstreetmap", "osm", "itrs", "mountain-bike", "josm", "overpass"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
itrs-to-osm = "itrs_to_osm.cli:main"

[project.urls]
Homepage = "https://github.com/c0nsumer/itrs-to-osm"

[tool.setuptools.packages.find]
include = ["itrs_to_osm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
